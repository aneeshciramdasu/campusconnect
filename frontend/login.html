<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CampusConnect - Login</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script src="api-config.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f5f3ff',
              100: '#ede9fe',
              200: '#ddd6fe',
              500: '#8b5cf6',
              600: '#7c3aed',
              700: '#6d28d9'
            }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif']
          }
        }
      }
    };
  </script>
</head>
<body class="min-h-screen bg-[#faf9ff] text-slate-800 font-sans antialiased">
  <header class="h-20 border-b border-brand-100 bg-white/90">
    <div class="mx-auto flex h-full max-w-7xl items-center justify-between px-6">
      <a href="exploreevnts.html" class="flex items-center gap-3" aria-label="CampusConnect Explore Events">
        <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-gradient-to-tr from-brand-600 to-indigo-500 text-white shadow-md">
          <svg class="h-6 w-6" fill="none" stroke="currentColor" viewbox="0 0 24 24">
            <path d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
          </svg>
        </div>
        <span class="text-2xl font-bold tracking-tight text-slate-900">Campus<span class="text-brand-600">Connect</span></span>
      </a>
      <div data-auth-controls class="flex items-center gap-1"></div>
    </div>
  </header>

  <main class="mx-auto flex min-h-[calc(100vh-80px)] max-w-7xl items-center justify-center px-6 py-10">
    <section class="w-full max-w-md rounded-3xl border border-brand-100 bg-white p-6 shadow-sm sm:p-8" aria-labelledby="login-heading">
      <div class="mb-7 text-center">
        <div class="mx-auto mb-4 flex h-12 w-12 items-center justify-center rounded-2xl bg-brand-100 text-brand-700">
          <svg class="h-6 w-6" fill="none" stroke="currentColor" viewbox="0 0 24 24">
            <path d="M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2m7-10a4 4 0 100-8 4 4 0 000 8zm13 2l-4 4m0-4l4 4" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
          </svg>
        </div>
        <h1 id="login-heading" class="text-3xl font-extrabold tracking-tight text-slate-900">Welcome back</h1>
        <p class="mt-2 text-sm text-slate-500">Sign in to access your CampusConnect account.</p>
      </div>

      <div id="auth-alert" class="mb-5 hidden rounded-xl border px-4 py-3 text-sm" role="alert" aria-live="polite"></div>

      <form id="login-form" novalidate>
        <div class="mb-5">
          <label for="email" class="mb-2 block text-sm font-semibold text-slate-700">Email address</label>
          <input id="email" name="email" type="email" autocomplete="email" required class="w-full rounded-xl border border-brand-100 px-4 py-3 text-slate-800 outline-none transition focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20" placeholder="student@campus.edu"/>
        </div>

        <div class="mb-6">
          <label for="password" class="mb-2 block text-sm font-semibold text-slate-700">Password</label>
          <div class="relative">
            <input id="password" name="password" type="password" autocomplete="current-password" required class="w-full rounded-xl border border-brand-100 px-4 py-3 pr-20 text-slate-800 outline-none transition focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20" placeholder="Enter your password"/>
            <button type="button" data-password-toggle="password" class="absolute inset-y-0 right-0 px-4 text-sm font-semibold text-brand-700" aria-label="Show password" aria-pressed="false">Show</button>
          </div>
        </div>

        <button id="login-submit" type="submit" class="flex w-full items-center justify-center rounded-xl bg-brand-600 px-5 py-3.5 font-semibold text-white shadow-sm transition hover:bg-brand-700 disabled:cursor-not-allowed disabled:opacity-60">
          Login
        </button>
      </form>

      <p class="mt-6 text-center text-sm text-slate-500">
        New to CampusConnect?
        <a href="signup.html" class="font-semibold text-brand-700 hover:text-brand-800">Create an account</a>
      </p>
    </section>
  </main>

  <script type="module">
    import "./auth.js";

    const form = document.getElementById("login-form");
    const submit = document.getElementById("login-submit");
    const alertBox = document.getElementById("auth-alert");

    function showAlert(message, type = "error") {
      alertBox.textContent = message;
      alertBox.className = type === "success"
        ? "mb-5 rounded-xl border border-emerald-200 bg-emerald-50 px-4 py-3 text-sm text-emerald-700"
        : "mb-5 rounded-xl border border-rose-200 bg-rose-50 px-4 py-3 text-sm text-rose-700";
    }

    document.querySelectorAll("[data-password-toggle]").forEach((button) => {
      button.addEventListener("click", () => {
        const input = document.getElementById(button.dataset.passwordToggle);
        const show = input.type === "password";
        input.type = show ? "text" : "password";
        button.textContent = show ? "Hide" : "Show";
        button.setAttribute("aria-label", show ? "Hide password" : "Show password");
        button.setAttribute("aria-pressed", String(show));
      });
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (!email || !password) {
        showAlert("Enter both your email address and password.");
        return;
      }

      submit.disabled = true;
      submit.textContent = "Signing in...";

      try {
        await window.CampusConnectAuth.signIn(email, password);
        showAlert("Login successful. Redirecting...", "success");
        window.location.href = "exploreevnts.html";
      } catch (error) {
        showAlert(window.CampusConnectAuth.friendlyAuthError(error));
      } finally {
        submit.disabled = false;
        submit.textContent = "Login";
      }
    });
  </script>
</body>
</html>

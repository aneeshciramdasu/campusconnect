<script type="module">
const content = document.getElementById("registrations-content");
const countBadge = document.getElementById("registration-count");

function escapeHtml(value) {
  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function showState(title, message, showExplore = false) {
  content.innerHTML = `
    <div class="bg-white border border-gray-200/90 rounded-2xl p-12 text-center shadow-sm flex flex-col items-center">
      <div class="w-16 h-16 rounded-2xl bg-brand-50 border border-brand-100 flex items-center justify-center text-brand-600 mb-5">
        <svg class="w-8 h-8" fill="none" stroke="currentColor" stroke-width="1.75" viewbox="0 0 24 24">
          <path d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>
      </div>
      <h2 class="text-xl font-bold text-gray-900">${escapeHtml(title)}</h2>
      <p class="text-sm text-gray-500 max-w-md mt-2">${escapeHtml(message)}</p>
      ${showExplore ? '<a href="exploreevnts.html" class="mt-7 inline-flex items-center justify-center px-7 py-3 rounded-xl bg-brand-600 hover:bg-brand-700 text-white font-medium text-sm">Explore Campus Events</a>' : ""}
    </div>
  `;
}

async function loadRegistrations() {
  if (!window.CampusConnectAuth) {
    showState("Authentication unavailable", "Please refresh and try again.");
    return;
  }

  if (window.CampusConnectAuth.configurationError) {
    showState("Configuration required", window.CampusConnectAuth.configurationError);
    return;
  }

  const user = await window.CampusConnectAuth.getUser();
  if (!user) {
    showState("Login required", "Sign in to view your registered events.", true);
    window.setTimeout(() => { window.location.href = "login.html"; }, 1500);
    return;
  }

  const token = await window.CampusConnectAuth.getAccessToken();
  if (!token) {
    showState("Session unavailable", "Please log in again.");
    return;
  }

  try {
    const response = await fetch(`${window.CampusConnectApiConfig.baseUrl}/me/registrations`, {
      headers: {
        "Accept": "application/json",
        "Authorization": `Bearer ${token}`
      }
    });

    if (response.status === 401) {
      showState("Session expired", "Please log in again.");
      return;
    }
    if (!response.ok) {
      const errorBody = await response.json().catch(() => null);
      throw new Error(
        errorBody?.detail ||
        `CampusConnect API returned HTTP ${response.status}`
      );
    }

    const registrations = await response.json();
    if (!Array.isArray(registrations)) {
      throw new Error("Unexpected registrations response");
    }

    if (!registrations.length) {
      countBadge.classList.add("hidden");
      showState("No registrations yet", "Discover and sign up for upcoming campus events.", true);
      return;
    }

    countBadge.textContent = `${registrations.length} Active`;
    countBadge.classList.remove("hidden");
    content.innerHTML = registrations.map((registration) => {
      const event = registration.events || {};
      const title = escapeHtml(event.title || "Untitled event");
      const status = escapeHtml(event.status || "Status unavailable");
      const statusLabel = status.charAt(0).toUpperCase() + status.slice(1);
      const isOpen = String(event.status).toLowerCase() === "open";
      const createdAt = registration.created_at
        ? new Date(registration.created_at).toLocaleDateString()
        : "Date unavailable";

      return `
        <article class="bg-white border border-gray-200/90 rounded-2xl p-6 shadow-sm hover:shadow-md transition-shadow">
          <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
            <div class="space-y-1.5">
              <h2 class="text-xl font-bold text-gray-900 tracking-tight">${title}</h2>
              <div class="flex items-center space-x-2 text-sm text-gray-500 font-medium">
                <span>Status: ${statusLabel}</span>
                <span class="text-gray-300">&bull;</span>
                <span>Registered ${escapeHtml(createdAt)}</span>
              </div>
            </div>
            <span class="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-full text-xs font-semibold ${isOpen ? "bg-emerald-50 text-emerald-700 border border-emerald-200/90" : "bg-slate-100 text-slate-700 border border-slate-200"}">
              Registered
            </span>
          </div>
        </article>
      `;
    }).join("");
  } catch {
    showState("Unable to load registrations", "Please confirm the backend is running and try again.");
  }
}

loadRegistrations();
</script>

services:
  - type: web
    name: campusconnect-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_USER_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: REGISTRATION_ENABLED
        value: false
